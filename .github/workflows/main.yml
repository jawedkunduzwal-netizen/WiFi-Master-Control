name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Find Android project
    run: |
      PROJECT_DIR=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Android project not found. Upload and extract the project files first."
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project found at $PROJECT_DIR"

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      chmod +x gradlew 2>/dev/null || true
      if [ -f gradlew ]; then
        ./gradlew assembleDebug
      else
        gradle assembleDebug
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: WiFi-Master-Control-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
